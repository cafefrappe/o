# 定时从甲骨文 VPS 采集状态，由 GitHub Actions 推送到 PushDeer（不依赖 Mac）
# 配置方式对齐 workbuddy-vps-ops 已跑通方案。
#
# Secrets（Settings → Secrets → Actions）：
#   PUSHDEER_KEY     PushDeer 的 PDU… 密钥
#   VPS_HOST         如 ubuntu@147.224.133.110
#   VPS_SSH_KEY      SSH 私钥；推荐 Base64 单行：
#                    macOS:  base64 < ~/.ssh/ssh-key-2026-06-17.key | pbcopy
name: PushDeer VPS Status

on:
  workflow_dispatch:
  schedule:
    # 每天 09:00 北京时间 = 01:00 UTC
    - cron: "0 1 * * *"

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 采集并推送
        env:
          PUSHDEER_KEY: ${{ secrets.PUSHDEER_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUSHDEER_KEY:-}" ] || [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "缺少 Secrets：PUSHDEER_KEY / VPS_HOST / VPS_SSH_KEY"
            exit 1
          fi

          KEYFILE="$(mktemp)"
          trap 'rm -f "$KEYFILE"' EXIT

          # 兼容：PEM 多行 / 字面量 \n / Base64 单行（推荐）
          write_key() {
            local raw="$1"
            raw="$(printf '%s' "$raw" | tr -d '\r')"
            if printf '%s' "$raw" | grep -q 'BEGIN .*PRIVATE KEY'; then
              printf '%s\n' "$raw" | sed 's/\\n/\n/g' >"$KEYFILE"
            else
              printf '%s' "$raw" | tr -d ' \n\t' | base64 -d >"$KEYFILE" 2>/dev/null \
                || printf '%s' "$raw" | tr -d ' \n\t' | base64 --decode >"$KEYFILE"
            fi
            [ -n "$(tail -c1 "$KEYFILE" | tr -d '\n' || true)" ] && printf '\n' >>"$KEYFILE"
            chmod 600 "$KEYFILE"
          }

          write_key "$VPS_SSH_KEY"

          if ! ssh-keygen -y -f "$KEYFILE" >/dev/null 2>&1; then
            echo "VPS_SSH_KEY 无法被识别为私钥（常见原因：换行丢失）。"
            echo "请在 Mac 执行： base64 < ~/.ssh/ssh-key-2026-06-17.key | pbcopy"
            echo "然后到 Secrets 里更新 VPS_SSH_KEY 为剪贴板内容（一整行 Base64）。"
            exit 1
          fi

          STATUS="$(ssh -i "$KEYFILE" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            "$VPS_HOST" \
            "bash /home/ubuntu/oracle-vps-pushdeer/collect_status.sh")"

          TITLE="$(printf '%s\n' "$STATUS" | head -n 1)"
          DESP="$(printf '%s\n' "$STATUS" | tail -n +2)"

          if [ "${#DESP}" -gt 3500 ]; then
            DESP="$(printf '%s' "$DESP" | head -c 3500)\n…(已截断)"
          fi

          ok=0
          for base in \
            "https://api2.pushdeer.com/message/push" \
            "https://api.pushdeer.com/message/push"
          do
            if curl -fsS --connect-timeout 15 --max-time 40 -X POST "$base" \
              --data-urlencode "pushkey=${PUSHDEER_KEY}" \
              --data-urlencode "text=${TITLE}" \
              --data-urlencode "desp=${DESP}"; then
              echo
              echo "pushed via $base"
              ok=1
              break
            fi
            echo "failed: $base" >&2
          done
          [ "$ok" = 1 ] || exit 1
